name: proxy-ticket-lab

services:
  tickets:
    build: .
    environment:
      INSTANCE_NAME: tickets-1
  tickets_b:
    build: .
    environment:
      INSTANCE_NAME: tickets-2

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      - tickets
      - tickets_b
    volumes:
      # Keep proxy configuration in the repository.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # All requests stay on the Compose network; no host port is needed.

  client:
    image: curlimages/curl:8.21.0
    profiles: ["tools"]
    command:
      - "--silent"
      - "--show-error"
      - "--include"
      - "--fail-with-body"
      - "--connect-timeout"
      - "3"
      - "--max-time"
      - "5"
      # Bypass environment-configured forward proxies.
      # Nginx is the requested destination, so this does not bypass Nginx.
      - "--noproxy"
      - "*"
      - "--header"
      - "X-Experiment: two-backends-1"
      - "http://nginx${REQUEST_PATH:-/tickets}"
