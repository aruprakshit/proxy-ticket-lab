# This file is loaded inside Nginx's http configuration.
# Record both the client response status and the backend response status.
log_format lab escape=json
  '{"worker_pid":$pid,'
  '"experiment":"$http_x_experiment",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status":$status,'
  '"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status"}';

# Two instances of the same application.
upstream ticket_backends {
    # Share backend selection state across Nginx worker processes.
    zone ticket_backends 64k;

    server tickets:4567;
    server tickets_b:4567;
}

server {
    listen 80;
    server_name nginx;

    access_log /dev/stdout lab;
    error_log /dev/stderr warn;

    # A visible marker added by this proxy to the response.
    add_header X-Proxy nginx always;

    location / {
        # Forward the original request path to our application.
        # Nginx selects a backend from the group defined above.
        proxy_pass http://ticket_backends;

        # Preserve the hostname the client requested.
        proxy_set_header Host $host;

        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }
}
