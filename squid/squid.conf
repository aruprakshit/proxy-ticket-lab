visible_hostname lab-forward-proxy

# Explicit forward-proxy listener.
http_port 3128

# Keep this first experiment focused on plain HTTP GET requests.
acl lab_get method GET
acl lab_http_port port 80

# Match the exact hostname in the requested URL.
# -n avoids reverse-DNS lookups for IP-address destinations.
acl approved_destination dstdomain -n approved.test

http_access allow lab_get lab_http_port approved_destination
http_access deny all

# Every experiment should reach the website, not a cached response.
cache deny all

# File logging avoids container stdout ownership issues.
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 0

# Writable by the unprivileged proxy user.
pid_filename /tmp/squid.pid